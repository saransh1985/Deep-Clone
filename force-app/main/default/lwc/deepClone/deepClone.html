<template>
  <lightning-quick-action-panel header={panelHeader}>
    <div class="panel-body">
      <template lwc:if={isLoading}>
        <div class="state state_center">
          <lightning-spinner
            alternative-text="Loading Deep Clone"
            size="medium"
          ></lightning-spinner>
        </div>
      </template>

      <template lwc:if={showLoadError}>
        <div class="state">
          <div
            class="slds-notify slds-notify_alert slds-alert_error"
            role="alert"
          >
            <span class="slds-assistive-text">Error</span>
            <h2>{loadError}</h2>
          </div>
        </div>
      </template>

      <template lwc:if={showBlocked}>
        <div class="state">
          <div
            class="slds-notify slds-notify_alert slds-alert_warning"
            role="alert"
          >
            <span class="slds-assistive-text">Warning</span>
            <h2>This action only works for Account record type Facility.</h2>
          </div>
          <p class="muted slds-m-top_x-small">{recordTypeLabel}</p>
        </div>
      </template>

      <template lwc:if={showForm}>
        <section class="account-summary">
          <lightning-layout vertical-align="center">
            <lightning-layout-item flexibility="auto">
              <p class="eyebrow">Facility action</p>
              <h2 class="account-name">{accountName}</h2>
            </lightning-layout-item>
            <lightning-layout-item>
              <lightning-icon
                icon-name="standard:account"
                size="small"
              ></lightning-icon>
            </lightning-layout-item>
          </lightning-layout>
        </section>

        <template lwc:if={cloneError}>
          <div
            class="slds-notify slds-notify_alert slds-alert_error clone-alert"
            role="alert"
          >
            <span class="slds-assistive-text">Error</span>
            <h2>{cloneError}</h2>
          </div>
        </template>

        <section class="identifier-panel slds-box slds-theme_default">
          <lightning-layout multiple-rows>
            <template for:each={summaryValues} for:item="summary">
              <lightning-layout-item
                key={summary.label}
                size="12"
                small-device-size="6"
                medium-device-size="3"
                padding="horizontal-small"
                class="identifier-item"
              >
                <p class="field-label">{summary.label}</p>
                <p class="field-value">{summary.value}</p>
              </lightning-layout-item>
            </template>
          </lightning-layout>
        </section>

        <template lwc:if={showActionChoice}>
          <section class="action-options">
            <template for:each={actionOptions} for:item="option">
              <div class="action-row" key={option.value}>
                <lightning-input
                  type="toggle"
                  label={option.label}
                  variant="label-hidden"
                  data-action={option.value}
                  checked={option.checked}
                  message-toggle-active=""
                  message-toggle-inactive=""
                  onchange={handleActionToggle}
                  disabled={isBusy}
                ></lightning-input>
                <div class="action-copy">
                  <h3>{option.label}</h3>
                  <p class="muted">{option.description}</p>
                </div>
              </div>
            </template>
          </section>
        </template>

        <template lwc:if={showDeepCloneForm}>
          <section class="questions">
            <template for:each={questionRows} for:item="row">
              <div class="question-row" key={row.toggleField}>
                <lightning-layout multiple-rows vertical-align="center">
                  <lightning-layout-item
                    size="12"
                    medium-device-size="5"
                    padding="horizontal-small"
                    class="question-control"
                  >
                    <lightning-input
                      type="toggle"
                      label={row.toggleLabel}
                      data-field={row.toggleField}
                      checked={row.checked}
                      message-toggle-active=""
                      message-toggle-inactive=""
                      onchange={handleToggle}
                      disabled={isBusy}
                    ></lightning-input>
                  </lightning-layout-item>
                  <lightning-layout-item
                    size="12"
                    medium-device-size="7"
                    padding="horizontal-small"
                    class="question-input"
                  >
                    <template lwc:if={row.showInput}>
                      <template lwc:if={row.isAddress}>
                        <lightning-input-address
                          address-label={row.inputLabel}
                          street-label="Street"
                          city-label="City"
                          province-label="State"
                          postal-code-label="Postal Code"
                          country-label="Country"
                          street={row.street}
                          city={row.city}
                          province={row.province}
                          postal-code={row.postalCode}
                          country={row.country}
                          onchange={handleAddressInput}
                          disabled={isBusy}
                        ></lightning-input-address>
                      </template>
                      <template lwc:if={row.isScalar}>
                        <lightning-input
                          type={row.inputType}
                          label={row.inputLabel}
                          data-field={row.valueField}
                          value={row.value}
                          onchange={handleInput}
                          disabled={isBusy}
                          message-when-value-missing={row.requiredMessage}
                          required
                        ></lightning-input>
                      </template>
                    </template>
                    <template lwc:if={row.showCarryForward}>
                      <div class="carry-forward slds-box slds-theme_shade">
                        <p class="field-label">Carry forward</p>
                        <p class="field-value">{row.currentValue}</p>
                      </div>
                    </template>
                  </lightning-layout-item>
                </lightning-layout>
              </div>
            </template>
          </section>
        </template>

        <template lwc:if={showCloseFacilityForm}>
          <section class="close-form">
            <lightning-input
              type="date"
              label="Start Date"
              value={closeStartDate}
              disabled
            ></lightning-input>
            <lightning-input
              type="date"
              label="End Date"
              data-field="endDate"
              value={closeForm.endDate}
              onchange={handleCloseInput}
              disabled={isBusy}
              message-when-value-missing="End Date is required."
              required
            ></lightning-input>
          </section>
        </template>
      </template>

      <template lwc:if={showProgressModal}>
        <section
          class="progress-modal"
          role="dialog"
          aria-modal="true"
          aria-label={progressTitle}
        >
          <div class="progress-dialog">
            <div class="progress-dialog__header">
              <div class="progress-ring">
                <lightning-progress-ring
                  value={progressValue}
                  size="large"
                ></lightning-progress-ring>
                <lightning-spinner
                  alternative-text={progressTitle}
                  size="small"
                ></lightning-spinner>
              </div>
              <div>
                <h3>{progressTitle}</h3>
                <p class="muted">{activeProgressLabel}</p>
              </div>
            </div>
            <ol class="progress-list">
              <template for:each={progressSteps} for:item="step">
                <li key={step.key} class={step.className}>
                  <span class="step-status">
                    <template lwc:if={step.isDone}>
                      <lightning-icon
                        icon-name="utility:success"
                        size="xx-small"
                        alternative-text="Done"
                      ></lightning-icon>
                    </template>
                    <template lwc:if={step.isActive}>
                      <lightning-spinner
                        alternative-text="Current step"
                        size="small"
                      ></lightning-spinner>
                    </template>
                  </span>
                  <span>{step.label}</span>
                  <template lwc:if={step.countLabel}>
                    <lightning-badge label={step.countLabel}></lightning-badge>
                  </template>
                </li>
              </template>
            </ol>
          </div>
        </section>
      </template>
    </div>

    <div
      slot="footer"
      class="slds-grid slds-grid_align-end slds-gutters_x-small"
    >
      <lightning-button
        data-id="cancel"
        label="Cancel"
        icon-name="utility:close"
        onclick={handleCancel}
        disabled={isBusy}
      ></lightning-button>
      <template lwc:if={showActionChoice}>
        <lightning-button
          data-id="next"
          variant="brand"
          label="Next"
          icon-name="utility:forward"
          onclick={handleNext}
          disabled={isNextDisabled}
        ></lightning-button>
      </template>
      <template lwc:if={showBackButton}>
        <lightning-button
          data-id="back"
          label="Back"
          icon-name="utility:back"
          onclick={handleBack}
          disabled={isBusy}
        ></lightning-button>
      </template>
      <template lwc:if={showDeepCloneForm}>
        <lightning-button
          data-id="start"
          variant="brand"
          label="Start Deep Clone"
          icon-name="utility:copy"
          onclick={handleStart}
          disabled={isStartDisabled}
        ></lightning-button>
      </template>
      <template lwc:if={showCloseFacilityForm}>
        <lightning-button
          data-id="finish"
          variant="brand"
          label="Finish"
          icon-name="utility:check"
          onclick={handleFinish}
          disabled={isBusy}
        ></lightning-button>
      </template>
    </div>
  </lightning-quick-action-panel>
</template>
